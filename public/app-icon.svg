<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- hyper-markdown app icon: Scandinavian instrument panel. Flat charcoal
       tile (#161616), the markdown "M" in paper (#fafaf8) and the hyper
       lightning bolt in the cobalt accent — no shadows, no outlines. -->

  <!-- Charcoal tile, near-square corners to echo the app's 2px radius -->
  <rect x="112" y="112" width="800" height="800" rx="48" fill="#161616"/>

  <g transform="translate(236.6 339.2) scale(2.7)">
    <!-- Markdown "M" in paper -->
    <path fill="#fafaf8" d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39H30z"/>
    <!-- Hyper lightning bolt in cobalt -->
    <g transform="translate(116.2 23.2) scale(3.4)">
      <path fill="#4070e5" d="M7 2v11h3v9l7-12h-4l4-8z"/>
    </g>
  </g>
</svg>
